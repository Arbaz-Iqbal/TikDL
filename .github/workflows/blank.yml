name: Build APK                      # Actions tab mein ye naam dikhega
on:
  push:                              # jab bhi file add/change ho, build shuru
  workflow_dispatch:                 # "Run workflow" button bhi chalega
jobs:
  build:
    runs-on: ubuntu-latest           # GitHub ka free computer
    steps:
      - uses: actions/checkout@v4    # tumhari files uthao
      - uses: actions/setup-java@v4  # Java 17 install karo
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3 # Gradle install karo
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug    # APK banao
      - uses: actions/upload-artifact@v4 # APK download ke liye rakho
        with:
          name: TikDL-apk
          path: app/build/outputs/apk/debug/app-debug.apk
