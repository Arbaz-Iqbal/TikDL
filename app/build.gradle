plugins {
    id 'com.android.application'        // this module is an Android app
    id 'org.jetbrains.kotlin.android'   // we write it in Kotlin
}

android {
    namespace 'com.arbaz.tikdl'   // app's code package name
    compileSdk 34                 // Android version used to compile

    defaultConfig {
        applicationId 'com.arbaz.tikdl' // unique app ID on the phone
        minSdk 29                       // Android 10+ (needed for easy saving to Movies)
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
// No dependencies: no ads, no trackers, nothing extra
